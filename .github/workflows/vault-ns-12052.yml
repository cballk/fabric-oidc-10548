name: vault-ns-enum-12052
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: show runner prereqs
        run: |
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS}"
          python3 -V
      - name: probe vault namespaces (read-only)
        run: python3 vault_ns_probe.py
