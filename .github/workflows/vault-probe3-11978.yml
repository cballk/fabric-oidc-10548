name: vault-role-aud-claims-11978
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: show runner
        run: |
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS}"
          python3 -V
      - name: probe vault role existence / audiences / claims (read-only)
        run: python3 i11978/vault_probe3.py
