name: histscan-11999
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        group: [X]
    steps:
      - uses: actions/checkout@v4
      - name: prep
        run: |
          df -h / | tail -1
          git --version
          python3 -V
      - name: scan group
        env:
          GROUP: ${{ matrix.group }}
          GIT_TERMINAL_PROMPT: "0"
          CLONE_FILTER: "blob:limit=2m"
        run: python3 hist_scan.py "$GROUP"
